spring.application.name=sonora-spring
server.port=8081
spring.config.import=optional:file:.env[.properties]

mail.host=smtp.gmail.com
mail.port=587

mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Health Check do Node.js
sonora.node.health-url=${NODE_HEALTH_URL:http://localhost:8080/api/health}
sonora.node.timeout=5000

# Conexão MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonora?connectTimeout=5000&socketTimeout=5000}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexões
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
sonora.mysql.timeout=5000